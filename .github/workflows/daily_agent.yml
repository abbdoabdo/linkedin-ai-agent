
name: LinkedIn AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 11 * * *"
      timezone: "Africa/Casablanca"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai
          python -m pip install huggingface_hub
          python -m pip install pillow
          python -m pip install requests

      - name: Generate LinkedIn topic and post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_post.py

      - name: Show generated topic
        run: |
          echo "===== TOPIC ====="
          cat current_topic.txt
          echo "================="

      - name: Show generated LinkedIn post
        run: |
          echo "===== LINKEDIN POST ====="
          cat linkedin_post.txt
          echo "========================="

      - name: Generate AI image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python generate_image.py

      - name: Check generated files
        run: |
          echo "===== GENERATED FILES ====="
          ls -lh current_topic.txt
          ls -lh linkedin_post.txt
          ls -lh linkedin_test_hf.png
          echo "==========================="

      - name: Test LinkedIn Access Token
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("LINKEDIN_ACCESS_TOKEN")

          if not token:
              raise SystemExit("LINKEDIN_ACCESS_TOKEN is missing.")

          url = "https://api.linkedin.com/v2/userinfo"

          response = requests.get(
              url,
              headers={
                  "Authorization": f"Bearer {token}"
              },
              timeout=30,
          )

          print("HTTP STATUS:", response.status_code)
          print("RESPONSE:")
          print(response.text)

          if response.status_code == 200:
              print("LINKEDIN_USERINFO_SUCCESS")
          else:
              print("LINKEDIN_USERINFO_FAILED")
          PY

      - name: Stop after LinkedIn test
        run: |
          echo "LinkedIn API test completed."
          echo "This is a temporary test workflow."
