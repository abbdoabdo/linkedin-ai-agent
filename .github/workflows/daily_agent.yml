name: LinkedIn AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 11 * * *"
      timezone: "Africa/Casablanca"

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai
          python -m pip install huggingface_hub pillow

      - name: Generate LinkedIn post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_post.py

      - name: Show generated post
        run: |
          echo "===== GENERATED LINKEDIN POST ====="
          cat linkedin_post.txt
          echo "===================================="

      - name: Generate AI image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python generate_image.py

      - name: Check generated files
        run: |
          echo "===== POST ====="
          ls -lh linkedin_post.txt
          echo "===== IMAGE ====="
          ls -lh linkedin_test_hf.png

      - name: Save topic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add topics_history.json

          if git diff --cached --quiet; then
            echo "No topic history changes to commit."
          else
            git commit -m "Update topic history"
            git push
          fi

      - name: Upload generated content
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-generated-content
          path: |
            linkedin_post.txt
            linkedin_test_hf.png
          retention-days: 7
